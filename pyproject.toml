[project]
name = "trinolio"
version = "26.10"
description = "Pull your Nolio triathlon training and wellness history into local parquet, and analyse it yourself"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "julienprodhon", email = "julien@prodhon.net" }]
keywords = ["nolio", "triathlon", "training", "cycling", "running", "polars", "parquet"]
# No `License ::` classifier: PEP 639 deprecates it where `license` is an SPDX expression.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fitdecode>=0.11.0",
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/julienprodhon/trinolio"
Repository = "https://github.com/julienprodhon/trinolio"
Issues = "https://github.com/julienprodhon/trinolio/issues"

[project.scripts]
trinolio = "trinolio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["trinolio"]

[tool.coverage.report]
#  `auth`, `push.send` and the request in `fetch_trainings` are thin wrappers over httpx
exclude_also = ["raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.vulture]
paths = ["trinolio", "tests"]
min_confidence = 60
ignore_decorators = ["@app.command", "@pytest.fixture"]
ignore_names = ["id", "hour", "type", "unit", "source", "format"]

[tool.ty.rules]
# Every rule fails the gate, so a new warning cannot scroll past unread
all = "error"
# An empty `--since` or environment variable is meant to read as absent
truthiness-test-of-none-union = "ignore"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A", 
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "E",
    "ERA",
    "F",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S", 
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]

ignore = [
    "ANN401",
    "TRY003", 
]

[tool.ruff.lint.flake8-bugbear]
# How typer declares a positional argument. `typer.Option` is already exempt.
extend-immutable-calls = ["typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"trinolio/cli.py" = [
    "T201",    # printing is what a CLI does
    "PLR0913", # a command's options are its signature, and typer reads them from it
    "PLR0917",
]
"tests/*" = [
    "S101",    # asserting is what a test does
    "PLR2004", # the expected value is the point of the test, not a magic number
]
